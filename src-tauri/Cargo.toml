[package]
name = "local-document-translator"
version = "0.1.0"
description = "Offline multilingual document translator"
authors = ["Local Document Translator contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "local_document_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
quick-xml = "0.41.0"
pulldown-cmark = "0.13.0"
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "macros", "sync", "time"] }
tokio-util = "0.7.18"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.24.0"
